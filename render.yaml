services:
  - type: web
    name: kpi-dashboard-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kpi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # you will be asked to type a password in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: kpi-db
    plan: free
